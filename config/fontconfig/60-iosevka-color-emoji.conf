<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>Iosevka</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x23f8</int><int>0x23fa</int></range>
          <int>0x2600</int>
          <int>0x26a1</int>
          <int>0x274c</int>
          <int>0x274e</int>
          <range><int>0x1f550</int><int>0x1f567</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
