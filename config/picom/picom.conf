backend = "glx";
vsync = true;
use-damage = false;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = false;

shadow = false;
shadow-radius = 0;
shadow-opacity = 0.0;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#000000";
shadow-exclude = [
	"class_g = 'dwm'",
	"class_g = 'dwm-systray'",
	"class_g = 'slop'",
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"window_type = 'menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'popup_menu'",
	"window_type = 'tooltip'",
	"window_type = 'notification'",
	"_GTK_FRAME_EXTENTS@"
];

fading = true;
fade-in-step = 0.075;
fade-out-step = 0.075;
fade-delta = 5;
fade-exclude = [ "class_g = 'dwm'", "class_g = 'dmenu'", "class_g = 'slock'" ];
